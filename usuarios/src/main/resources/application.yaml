server:
  port: 8081

spring:
  application:
    name: usuarios
  datasource:
    url: jdbc:postgresql://localhost:5432/usuariosdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    generate-ddl: true
    show-sql: true
    hibernate:
      ddl-auto: create
logging:
  level: 
    org:
      hibernate:
        SQL: debug